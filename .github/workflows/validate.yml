# Content integrity + skill frontmatter checks. Self-contained (no external actions beyond
# checkout). Runs on untrusted PRs: read-only perms, and MUST NOT execute repository code.
name: validate
on:
  push:
  pull_request:
permissions: read-all
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Content integrity check
        run: |
          set -e
          fail=0
          # Match the specific internal-distribution marker, not the bare word
          # "CONFIDENTIAL" — a proprietary EULA legitimately says "Confidential
          # Information". Exclude .github/ (these strings appear here as grep targets).
          for s in "Not for external distribution" "BEGIN PRIVATE KEY" "BEGIN OPENSSH PRIVATE KEY"; do
            if grep -rIl --exclude-dir=.git --exclude-dir=.github "$s" . ; then
              echo "::error::forbidden content found: $s"; fail=1
            fi
          done
          exit $fail
      - name: Skill frontmatter check
        run: |
          python3 - <<'PY'
          import os, sys, glob, re
          bad = []
          for md in glob.glob("skills/*/SKILL.md"):
              skill_dir = os.path.basename(os.path.dirname(md))
              head = open(md, encoding="utf-8").read().split("---")
              if len(head) < 3:
                  bad.append(f"{md}: no frontmatter"); continue
              fm = head[1]
              name = next((l.split(":",1)[1].strip() for l in fm.splitlines()
                           if l.strip().startswith("name:")), "")
              desc = ""
              lines = fm.splitlines()
              i = 0
              while i < len(lines):
                  raw = lines[i]
                  if raw.strip().startswith("description:"):
                      rest = raw.split(":", 1)[1].strip()
                      if rest in ("|", ">", "|-", ">-", "|+", ">+") or rest == "":
                          parts = []
                          i += 1
                          while i < len(lines):
                              nxt = lines[i]
                              if nxt.startswith(" ") or nxt.startswith("\t") or nxt.strip() == "":
                                  parts.append(nxt.strip() if nxt.strip() else "")
                                  i += 1
                                  continue
                              break
                          desc = " ".join(p for p in parts if p).strip()
                          continue
                      desc = rest.strip().strip("\"'")
                  i += 1
              if desc and len(desc) > 1024:
                  bad.append(f"{md}: description length {len(desc)} > 1024")
              if not name:           bad.append(f"{md}: missing name")
              elif name != skill_dir: bad.append(f"{md}: name '{name}' != dir '{skill_dir}'")
              if name and re.match(r"^[a-z][a-z0-9-]*$", name) is None:
                  bad.append(f"{md}: name not kebab-case: {name}")
              if not desc:           bad.append(f"{md}: missing description")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("frontmatter OK")
          PY
      - name: Site structure check
        if: hashFiles('docs/*.html') != ''
        run: |
          python3 - <<'PY'
          import glob, re, sys
          fails = []
          pages = {f.split("/")[-1]: open(f, encoding="utf-8").read()
                   for f in glob.glob("docs/*.html")}
          ids = {n: set(re.findall(r'id="([^"]+)"', t)) for n, t in pages.items()}
          for name, text in sorted(pages.items()):
              body = re.sub(r"<!--.*?-->", "", text, flags=re.DOTALL)
              if 'href="site.css"' not in body:
                  fails.append(f"{name}: shared stylesheet not linked")
              if "—" in body:
                  fails.append(f"{name}: em dash outside comments")
              for m in re.finditer(r'(?:src|href)="(https?://[^"/]+)', body):
                  if not any(h in m.group(1) for h in ("github.com", "jgsystemsconsulting.github.io", "labs.jgsystemsconsulting.com")):
                      fails.append(f"{name}: third-party host {m.group(1)}")
              for m in re.finditer(r'href="([^"#]*)(#[^"]+)?', body):
                  target, frag = m.group(1), m.group(2)
                  if not frag:
                      continue
                  page_ids = ids.get(target if target else name)
                  if page_ids is None:
                      if not target.startswith("http"):
                          fails.append(f"{name}: anchor to missing page {target}")
                  elif frag[1:] not in page_ids:
                      fails.append(f"{name}: anchor {frag} not on {target or name}")
          if fails:
              print("
".join(fails)); sys.exit(1)
          print("site structure OK")
          PY
